[workspace]
resolver = "2"
members = [
  "crates/chrono-ipc",
  "crates/chrono-cli",
  "crates/chrono-gateway",
  "crates/chrono-config",
  "crates/chrono-adapter-telegram",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/intro/ChronoSys"

[workspace.dependencies]
chrono-ipc = { path = "crates/chrono-ipc" }
chrono-gateway = { path = "crates/chrono-gateway" }
chrono-config = { path = "crates/chrono-config" }
chrono-adapter-telegram = { path = "crates/chrono-adapter-telegram" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
teloxide = { version = "0.13", features = ["ctrlc_handler", "rustls"] }
futures = "0.3"

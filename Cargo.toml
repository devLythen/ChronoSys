[workspace]
resolver = "2"
members = [
  "crates/chrono-ipc",
  "crates/chrono-gateway",
  "crates/chrono-sys",
  "crates/chrono-config",
  "crates/chrono-adapter-telegram",
  "crates/chrono-api",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/intro/ChronoSys"

[workspace.dependencies]
chrono-ipc = { path = "crates/chrono-ipc" }
chrono-gateway = { path = "crates/chrono-gateway" }
chrono-config = { path = "crates/chrono-config" }
chrono-sys = { path = "crates/chrono-sys" }
chrono-adapter-telegram = { path = "crates/chrono-adapter-telegram" }
chrono-api = { path = "crates/chrono-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
teloxide = { version = "0.13", features = ["ctrlc_handler", "rustls"] }
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
